name: Build and publish Caldas Gestão image

on:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production
  workflow_dispatch:

permissions: {}

concurrency:
  group: caldas-gestao-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql, redis
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate Wayfinder routes
        run: php artisan wayfinder:generate --with-form

      - name: Run quality checks
        run: composer run lint:check

      - name: Check formatting
        run: npm run format:check

      - name: Check TypeScript
        run: npm run types:check

      - name: Build frontend
        run: npm run build

      - name: Run Laravel tests
        run: php artisan test --compact

  publish:
    name: Publish image to GHCR
    needs: quality
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP for Wayfinder
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql, redis
          coverage: none

      - name: Install PHP dependencies for Wayfinder
        run: composer install --no-interaction --prefer-dist

      - name: Generate Wayfinder routes
        run: php artisan wayfinder:generate --with-form

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=production
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WAYFINDER_SKIP_GENERATE=true
          cache-from: type=gha,scope=caldas-gestao
          cache-to: type=gha,mode=max,scope=caldas-gestao
          sbom: true
          provenance: mode=max

      - name: Verify image availability in GHCR
        run: |
          image_tag="sha-${GITHUB_SHA::7}"
          for attempt in 1 2 3 4 5 6; do
            if docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${image_tag}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "The pushed image was not available in GHCR after retries."
          exit 1

      - name: Trigger Coolify deployment
        env:
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          image_tag="sha-${GITHUB_SHA::7}"
          curl --fail-with-body --retry 3 --retry-delay 5 --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${COOLIFY_DEPLOY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"docker_registry_image_tag":"'"${image_tag}"'"}' \
            "https://cy.caldasindica.com/api/v1/applications/svurav3cvfovuz8adtv1fuwv"
          curl --fail-with-body --retry 3 --retry-delay 5 --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${COOLIFY_DEPLOY_TOKEN}" \
            "https://cy.caldasindica.com/api/v1/deploy?uuid=svurav3cvfovuz8adtv1fuwv"
