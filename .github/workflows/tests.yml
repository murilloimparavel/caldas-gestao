name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: caldas_gestao_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d caldas_gestao_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: caldas_gestao_test
      DB_USERNAME: caldas_runtime
      DB_PASSWORD: caldas_runtime_test
      DB_SCHEMA: app
      DB_SEARCH_PATH: app,public
      DB_SSLMODE: disable
      DB_RUNTIME_ROLE: caldas_runtime
      DB_PROVISION_STRICT: true
      MIGRATION_DB_CONNECTION: pgsql
      MIGRATION_DB_HOST: 127.0.0.1
      MIGRATION_DB_PORT: 5432
      MIGRATION_DB_DATABASE: caldas_gestao_test
      MIGRATION_DB_USERNAME: postgres
      MIGRATION_DB_PASSWORD: postgres
      MIGRATION_DB_SSLMODE: disable
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Create least-privilege runtime role
        env:
          PGPASSWORD: postgres
        run: >-
          psql --host=127.0.0.1 --username=postgres --dbname=caldas_gestao_test
          --set=ON_ERROR_STOP=1
          --command="CREATE ROLE caldas_runtime LOGIN PASSWORD 'caldas_runtime_test'"

      - name: Setup Application
        run: composer setup

      - name: Prove migration rollback and reapplication
        run: |
          php artisan migrate:rollback --database=migration --force --no-interaction
          php artisan migrate --database=migration --force --no-interaction

      - name: Run CI Checks
        run: composer ci:check
