name: Produção · Deploy no Coolify

on:
  workflow_run:
    workflows:
      - Produção · Construir e publicar imagem
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    name: Publicar aplicação no Coolify
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'production'
    runs-on: ubuntu-latest
    steps:
      - name: Validar configuração do webhook
        env:
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: test -n "$COOLIFY_DEPLOY_TOKEN"

      - name: Sincronizar schema de busca do banco
        env:
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          payload="$(jq -n --arg key 'DB_SEARCH_PATH' --arg value 'app,public' '{key: $key, value: $value, is_preview: false}')"
          set +e
          patch_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request PATCH \
            --header "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "https://cy.caldasindica.com/api/v1/applications/svurav3cvfovuz8adtv1fuwv/envs")"
          patch_exit=$?
          set -e

          if [ "$patch_exit" -ne 0 ] && [ "$patch_status" != "404" ]; then
            echo "Coolify PATCH request failed with curl exit $patch_exit and HTTP status $patch_status."
            exit "$patch_exit"
          fi

          if [ "$patch_status" = "404" ]; then
            post_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request POST \
              --header "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              "https://cy.caldasindica.com/api/v1/applications/svurav3cvfovuz8adtv1fuwv/envs")"

            case "$post_status" in
              2??) ;;
              *) echo "Coolify POST request failed with HTTP status $post_status."; exit 1 ;;
            esac
          else
            case "$patch_status" in
              2??) ;;
              *) echo "Coolify PATCH request failed with HTTP status $patch_status."; exit 1 ;;
            esac
          fi

      - name: Garantir tag de imagem de produção
        env:
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: >-
          curl --fail-with-body --silent --show-error --request PATCH
          --header "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN"
          --header "Content-Type: application/json"
          --data '{"docker_registry_image_tag":"production"}'
          "https://cy.caldasindica.com/api/v1/applications/svurav3cvfovuz8adtv1fuwv"

      - name: Disparar deploy
        env:
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: >-
          curl --fail-with-body --silent --show-error --request POST
          --header "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN"
          "https://cy.caldasindica.com/api/v1/deploy?uuid=svurav3cvfovuz8adtv1fuwv&force=true"
