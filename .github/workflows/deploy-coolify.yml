name: Deploy Caldas Gestão no Coolify

on:
  workflow_run:
    workflows:
      - Build and publish Caldas Gestão image
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Disparar deploy no Coolify
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Validar configuração do webhook
        env:
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: test -n "$COOLIFY_DEPLOY_TOKEN"

      - name: Disparar deploy
        env:
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: >-
          curl --fail-with-body --silent --show-error --request POST
          --header "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN"
          "https://cy.caldasindica.com/api/v1/deploy?uuid=3&force=false"
