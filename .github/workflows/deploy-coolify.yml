name: Produção · Deploy no Coolify

on:
  workflow_run:
    workflows:
      - Produção · Construir e publicar imagem
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Publicar aplicações no Coolify
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/production') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'production')
    runs-on: ubuntu-latest
    steps:
      - name: Validar configuração do webhook
        env:
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: test -n "$COOLIFY_DEPLOY_TOKEN"

      - name: Definir release imutável
        id: release
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          release_sha="$WORKFLOW_RUN_SHA"
          if [ -z "$release_sha" ]; then
            release_sha="$GITHUB_SHA"
          fi
          test -n "$release_sha"
          printf 'image_tag=sha-%s\n' "$release_sha" >> "$GITHUB_OUTPUT"

      - name: Validar UUIDs de produção
        env:
          WEB_UUID: svurav3cvfovuz8adtv1fuwv
          WORKER_UUID: nbhjuwa4qhs5brnwnbqg1ea2
          SCHEDULER_UUID: ni3lxtnuyk26jh3pwpfzbdiu
        run: |
          set -euo pipefail
          for application_uuid in "$WEB_UUID" "$WORKER_UUID" "$SCHEDULER_UUID"; do
            test -n "$application_uuid"
          done

      - name: Sincronizar administrador da plataforma
        env:
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          SUPER_ADMIN_EMAILS: ${{ secrets.SUPER_ADMIN_EMAILS }}
          APPLICATION_UUIDS: svurav3cvfovuz8adtv1fuwv nbhjuwa4qhs5brnwnbqg1ea2 ni3lxtnuyk26jh3pwpfzbdiu
        run: |
          set -euo pipefail
          test -n "$SUPER_ADMIN_EMAILS"
          payload="$(jq -n --arg key 'SUPER_ADMIN_EMAILS' --arg value "$SUPER_ADMIN_EMAILS" '{key: $key, value: $value, is_preview: false}')"

          for application_uuid in $APPLICATION_UUIDS; do
            env_url="https://cy.caldasindica.com/api/v1/applications/${application_uuid}/envs"
            patch_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request PATCH --header "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" --header "Content-Type: application/json" --data "$payload" "$env_url")"
            case "$patch_status" in
              2??) ;;
              404)
                post_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request POST --header "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" --header "Content-Type: application/json" --data "$payload" "$env_url")"
                case "$post_status" in
                  2??) ;;
                  *) echo "Coolify POST request failed for $application_uuid with HTTP status $post_status."; exit 1 ;;
                esac
                ;;
              *) echo "Coolify PATCH request failed for $application_uuid with HTTP status $patch_status."; exit 1 ;;
            esac
          done

      - name: Sincronizar schema de busca do banco
        env:
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          APPLICATION_UUIDS: svurav3cvfovuz8adtv1fuwv nbhjuwa4qhs5brnwnbqg1ea2 ni3lxtnuyk26jh3pwpfzbdiu
        run: |
          set -euo pipefail
          payload="$(jq -n --arg key 'DB_SEARCH_PATH' --arg value 'app,public' '{key: $key, value: $value, is_preview: false}')"
          for application_uuid in $APPLICATION_UUIDS; do
            env_url="https://cy.caldasindica.com/api/v1/applications/${application_uuid}/envs"
            patch_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request PATCH --header "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" --header "Content-Type: application/json" --data "$payload" "$env_url")"
            case "$patch_status" in
              2??) ;;
              404)
                post_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request POST --header "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" --header "Content-Type: application/json" --data "$payload" "$env_url")"
                case "$post_status" in
                  2??) ;;
                  *) echo "Coolify POST request failed for $application_uuid with HTTP status $post_status."; exit 1 ;;
                esac
                ;;
              *) echo "Coolify PATCH request failed for $application_uuid with HTTP status $patch_status."; exit 1 ;;
            esac
          done

      - name: Garantir tag de imagem de produção
        env:
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          APPLICATION_UUIDS: svurav3cvfovuz8adtv1fuwv nbhjuwa4qhs5brnwnbqg1ea2 ni3lxtnuyk26jh3pwpfzbdiu
        run: |
          set -euo pipefail
          for application_uuid in $APPLICATION_UUIDS; do
            curl --fail-with-body --silent --show-error --request PATCH \
            --header "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"docker_registry_image_tag\":\"$IMAGE_TAG\"}" \
            "https://cy.caldasindica.com/api/v1/applications/${application_uuid}"
          done

      - name: Disparar deploy
        env:
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          APPLICATION_UUIDS: svurav3cvfovuz8adtv1fuwv nbhjuwa4qhs5brnwnbqg1ea2 ni3lxtnuyk26jh3pwpfzbdiu
        run: |
          set -euo pipefail
          for application_uuid in $APPLICATION_UUIDS; do
            curl --fail-with-body --silent --show-error --request POST \
              --header "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" \
              "https://cy.caldasindica.com/api/v1/deploy?uuid=${application_uuid}&force=true"
          done
