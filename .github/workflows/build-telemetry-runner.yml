name: Telemetria · Construir imagem isolada

on:
  push:
    branches: [production]
    paths:
      - 'scripts/telemetry/**'
      - '.github/workflows/build-telemetry-runner.yml'
  workflow_dispatch:
    inputs:
      app_release:
        description: SHA completo da imagem de produção já construída
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: telemetry-runner-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'murilloimparavel/caldas-gestao' &&
      github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE: ${{ github.sha }}
      BASE_RELEASE: ${{ inputs.app_release || '1246bbfdb22f27a3ec0130db9da9bdcb4d74693f' }}
    steps:
      - name: Validar versão imutável
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_RELEASE" =~ ^[0-9a-f]{40}$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}-telemetry-runner"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "base=ghcr.io/${GITHUB_REPOSITORY,,}:sha-$BASE_RELEASE" >> "$GITHUB_OUTPUT"
      - name: Checkout da mesma versão
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE }}
          persist-credentials: false
      - name: Autenticar publicação GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3
      - name: Construir e publicar sem instalar no servidor
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/telemetry/Dockerfile.runner
          push: true
          build-args: APP_IMAGE=${{ steps.version.outputs.base }}
          tags: |
            ${{ steps.version.outputs.image }}:sha-${{ env.RELEASE }}
            ${{ steps.version.outputs.image }}:codex-0.165.0-sha-${{ env.RELEASE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE }}
            io.caldas.telemetry.codex-version=0.165.0
          cache-from: type=gha,scope=telemetry-runner
          cache-to: type=gha,mode=max,scope=telemetry-runner
      - name: Registrar pin para instalação explícita
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Imagem para instalação e recuperação: `%s@%s`\n\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'O pacote deve ser público para recuperação anônima. Nenhum deploy ou alteração de autenticação foi executado.\n' >> "$GITHUB_STEP_SUMMARY"
